# NZBLab-Agent auf TrueNAS SCALE (24.10 «Electric Eel» und neuer, Apps laufen mit Docker).
# Apps › Discover Apps › ⋮ (oben rechts) › Install via YAML › Name «nzblab-agent» › diesen Text einfügen › Save.
# Vorher anpassen: «tank» = Name deines Pools (Storage › Pools). Den Ordner /mnt/tank/apps/nzblab-agent legst du in
# Datasets an (Dataset «apps», darin «nzblab-agent»), oder Docker legt ihn beim ersten Start an.
# Token: Apps › Installed › nzblab-agent › Workloads › Logs: Zeile «NZBLab-Agent Token: …»
# Code und Anleitung (öffentlich einsehbar, PolyForm Shield 1.0.0): https://github.com/Tuxxler/nzblab-agent
# Ab 1.15.0 freiwillige Zusätze (SMART, Log-Auszüge, Backups, Netz-Messung aus): Blöcke S, L, B2 in ../docker-compose.yml.
services:
  nzblab-agent:
    image: ghcr.io/tuxxler/nzblab-agent:latest
    container_name: nzblab-agent
    restart: unless-stopped
    ports:
      - "8099:8099"
    environment:
      TZ: Europe/Zurich
      PUID: "568"           # TrueNAS-Benutzer «apps»; 0 = root, falls der Datei-Index Ordner nicht lesen darf
      PGID: "568"
      FILES_EXCLUDE: "ix-applications,.ix-apps,.system,apps"
      CACHE_ROOTS: ""       # TrueNAS hat keinen Unraid-Cache
      # DISCOVER_KEYS: "0"   # ab 1.16.0: API-Keys der Dienste nicht aus appdata lesen (Standard an, nur lesend, nur mit Token)
      # DISCOVER_ROOTS: ""  # leer = /host/mnt/user/apps (eigene Datasets); Katalog-Apps: /mnt/.ix-apps/app_mounts zusätzlich :ro einbinden und DISCOVER_ROOTS setzen
    volumes:
      # Pflicht: hier speichert der Agent Token und Verlauf, sonst gibt es nach jedem Update einen neuen Token
      - /mnt/tank/apps/nzblab-agent:/config             # Verlauf, Datei-Index, token.txt (lesen/schreiben)
      - /sys:/host/sys:ro
      - /proc:/host/proc:ro
      - /mnt/tank:/host/mnt/user:ro                     # Pool nur lesend: Datei-Index und Suche
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
