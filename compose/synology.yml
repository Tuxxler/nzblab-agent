# NZBLab-Agent auf Synology DSM 7.2 und neuer (Container Manager).
# 1. File Station: im Ordner «docker» den Ordner «nzblab-agent» anlegen.
# 2. Container Manager › Projekt › Erstellen › Name «nzblab-agent», Pfad /docker/nzblab-agent,
#    Quelle «docker-compose.yml erstellen» › diesen Text einfügen › Weiter › Fertig.
# Token: Container Manager › Container › nzblab-agent › Protokoll: Zeile «NZBLab-Agent Token: …»
# Mehrere Volumes: weitere Zeilen wie «/volume2:/host/mnt/volume2:ro» sind möglich, der Index sieht aber nur /host/mnt/user.
# Code und Anleitung (Open Source, AGPL-3.0): https://github.com/Tuxxler/nzblab-agent
# Ab 1.15.0 freiwillige Zusätze (SMART, Log-Auszüge, Backups, Netz-Messung aus): Blöcke S, L, B2 in ../docker-compose.yml.
# Was auf Synology geht (Prüfung 10.11.2026): System, RAM, Netz, Neustarts, RAID (mdadm/btrfs), Datei-Index, Dienste finden.
# Temperaturen und Lüfter sind modellabhängig (DSM ohne hwmon, meist leer). Platten (sata1…, sas1…) erst ab Agent 1.17.0.
# Hyper Backup wird nicht erkannt (eigenes Format). Virtual DSM hat keine Sensoren.
services:
  nzblab-agent:
    image: ghcr.io/tuxxler/nzblab-agent:latest
    container_name: nzblab-agent
    restart: unless-stopped
    ports:
      - "8099:8099"
    environment:
      TZ: Europe/Zurich
      # DSM regelt Freigaben über ACLs, die im Container keinem Benutzer entsprechen. Darum bleibt der Agent hier root;
      # alle NAS-Pfade sind trotzdem nur lesend eingebunden. Eigene Nummer (SSH: «id») geht auch, z. B. PUID 1026 / PGID 100.
      PUID: "0"
      PGID: "0"
      FILES_EXCLUDE: "@*,#*,docker"
      CACHE_ROOTS: ""
      # NZBLAB_LAN: "1"     # ab 1.18.0 Standard AUS: Heimnetz-Suche (alle 30 Min ein leeres UDP-Paket an jede Adresse des /24-Netzes, Reverse-DNS, Push bei neuen Geräten)
      # NZBLAB_NTFY_ALL: "1"  # ab 1.18.0: ntfy (NTFY_URL) auch für Info-Meldungen. Standard 0 = nur Kritisches (Platte/Array/Hitze)
      # DISCOVER_KEYS: "0"   # ab 1.16.0: API-Keys der Dienste nicht aus appdata lesen (Standard an, nur lesend, nur mit Token)
      # DISCOVER_ROOTS: ""  # leer = /host/mnt/user/docker (= /volume1/docker)
    volumes:
      # Pflicht: hier speichert der Agent Token und Verlauf, sonst gibt es nach jedem Update einen neuen Token
      - /volume1/docker/nzblab-agent:/config            # Verlauf, Datei-Index, token.txt (lesen/schreiben)
      - /sys:/host/sys:ro
      - /proc:/host/proc:ro
      - /volume1:/host/mnt/user:ro                      # Volume nur lesend: Datei-Index und Suche
    read_only: true
    tmpfs:
      - /tmp
    # Ab 1.16.1: nur diese Rechte statt der Docker-Standardliste. Mit PUID 0 bleibt der Agent root, aber nur mit ihnen
    # (DAC_OVERRIDE: Ordner anderer Pakete lesen). SMART: zusätzlich SYS_RAWIO unter cap_add.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
