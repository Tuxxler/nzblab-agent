# NZBLab-Agent: Docker-Image bauen und auf ghcr.io/tuxxler/nzblab-agent veröffentlichen.
# Build the image and publish it to ghcr.io/tuxxler/nzblab-agent.
# Auslöser / trigger: Tag «v1.10.0» (Version = Teil nach «v») oder von Hand (Actions › Agent-Image › Run workflow).
# Erstes Mal: GitHub › Packages › nzblab-agent › Package settings › Change visibility › Public.
name: Agent-Image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version ohne «v» (leer = VERSION aus nzblab_agent.py)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

concurrency:
  group: agent-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/tuxxler/nzblab-agent

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Agent-Tests
        run: python3 test_agent.py

      - name: Version bestimmen
        id: v
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          code_version=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' nzblab_agent.py)
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          elif [[ -n "${INPUT_VERSION}" ]]; then
            version="${INPUT_VERSION}"
          else
            version="${code_version}"
          fi
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version «${version}» ist nicht im Format 1.2.3"; exit 1
          fi
          if [[ "${version}" != "${code_version}" ]]; then
            echo "::error::Tag-Version ${version} passt nicht zu VERSION = \"${code_version}\" in nzblab_agent.py"; exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Anmelden bei ghcr.io (GITHUB_TOKEN)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bauen und hochladen (amd64, arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.v.outputs.created }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.v.outputs.version }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image kurz starten und /api/ping prüfen (amd64)
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name agent-smoke -p 18099:8099 "${IMAGE}:${{ steps.v.outputs.version }}"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18099/api/ping; then echo; break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18099/api/ping | grep -q '"version": "${{ steps.v.outputs.version }}"'
          # Token-Banner vorhanden (Inhalt nicht ausgeben)
          docker logs agent-smoke 2>&1 | grep -q "NZBLab-Agent Token:"
          docker logs agent-smoke 2>&1 | grep -v "Token:" | tail -n 5
          docker rm -f agent-smoke

      - name: Zusammenfassung
        run: |
          {
            echo "### NZBLab-Agent ${{ steps.v.outputs.version }}"
            echo "- \`${IMAGE}:${{ steps.v.outputs.version }}\`"
            echo "- \`${IMAGE}:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"
