# NZBLab-Agent mit Docker Compose: EINE Datei für alle Server-Typen (ab Agent 1.15.0).
# So gehts: den Block deines Servers (A–D) einkommentieren, die anderen Server-Blöcke so lassen; freiwillige Blöcke (S, L, B)
# nur bei Bedarf. Eine Zeile einkommentieren = das «# » am Anfang entfernen, Einrückung behalten.
# Fertige Einzeldateien mit denselben Werten: compose/linux.yml, compose/truenas.yml, compose/synology.yml; Unraid: lieber
# die Vorlage unraid/nzblab-agent.xml (Apps › «NZBLab-Agent»).
# Alle Host-Pfade nur lesend (:ro), nur /config ist schreibbar. Der Token steht beim ersten Start einmal im Log:
#   docker compose logs nzblab-agent | grep "NZBLab-Agent Token"
# Getestete Architekturen: amd64 und arm64 (beide werden gebaut; Raspberry Pi 4/5 mit 64-Bit-System, Intel/AMD-NAS).
# Der Agent aktualisiert sich nie selbst: neue Version = «docker compose pull && docker compose up -d».
# Anleitung: https://tuxxler.github.io/nzblab/agent.html · Code (Open Source, AGPL-3.0): https://github.com/Tuxxler/nzblab-agent
services:
  nzblab-agent:
    image: ghcr.io/tuxxler/nzblab-agent:latest
    container_name: nzblab-agent
    restart: unless-stopped
    ports:
      - "8099:8099"           # Linux-Block A: statt «ports» besser «network_mode: host» (siehe unten)
    # network_mode: host     # A (Linux): echte Netzwerkkarten, Heimnetz-Geräte. Dann «ports» oben löschen
    environment:
      TZ: Europe/Zurich
      PUID: "99"              # Benutzer nach dem Start (Unraid 99 = nobody); TrueNAS 568, Synology 0, Linux 65534; 0 = root
      PGID: "100"             # Gruppe (Unraid 100 = users); TrueNAS 568, Synology 0, Linux 65534
      # NZBLAB_AGENT_TOKEN: ""        # besser leer lassen (Agent erzeugt selbst einen); eigener: mindestens 32 zufällige Zeichen, sonst Fehler
      # NTFY_URL: "https://ntfy.sh/ein-langes-geheimes-wort"
      # NZBLAB_BIND: "0.0.0.0"        # nur auf dieser Adresse lauschen, z. B. die LAN-Adresse des NAS
      # NZBLAB_NET: "0"               # Netz-/Latenz-Messung aus (Standard an: TCP-Aufbau zu Router und 1.1.1.1:443, jede Minute)
      # NZBLAB_NET_TARGET: "1.1.1.1:443"
      # DISCOVER_KEYS: "0"            # ab 1.16.0: API-Keys von Sonarr, Radarr, SABnzbd … NICHT aus appdata lesen (Standard an,
      #                               # nur lesend, nur mit Token; Plex-Token nie). 0 = nur melden, welche Dienste es gibt
      # DISCOVER_ROOTS: ""            # appdata-Ordner im Container, Komma; leer = /host/mnt/user/appdata, sonst …/apps, …/docker
      # --- B (Linux, Debian/Ubuntu): Freigaben unter /host/fs statt /host/mnt/user
      # FILES_ROOT: "/host/fs"
      # CACHE_ROOTS: ""
      # --- C (TrueNAS SCALE):
      # FILES_EXCLUDE: "ix-applications,.ix-apps,.system,apps"
      # CACHE_ROOTS: ""
      # --- D (Synology DSM):
      # FILES_EXCLUDE: "@*,#*,docker"
      # CACHE_ROOTS: ""
      # --- S (SMART, freiwillig): siehe Block S unten
      # NZBLAB_SMART: "1"
      # --- L (Log-Auszüge, freiwillig): siehe Block L unten
      # NZBLAB_LOGS: "1"
      # --- B2 (Backups, freiwillig): Pfade im Container, durch Komma getrennt; Suche unter den Freigaben: NZBLAB_BACKUP_AUTO
      # NZBLAB_BACKUP_PATHS: "/host/backup/restic,/host/backup/rsync-backup.log"
      # NZBLAB_BACKUP_AUTO: "1"
    volumes:
      # Pflicht: hier speichert der Agent Token und Verlauf, sonst gibt es nach jedem Update einen neuen Token
      - ./nzblab-agent:/config                          # Verlauf, Datei-Index, token.txt (lesen/schreiben)
      - /sys:/host/sys:ro                               # Temperaturen, Grafikchip, Btrfs-Zustand
      - /proc:/host/proc:ro                             # CPU-Last, Programme, Plattenzugriffe, Neustarts, mdadm/ZFS-Zustand
      # --- Unraid (Standard):
      - /mnt/user:/host/mnt/user:ro                     # Freigaben: Datei-Index, Suche, Backup-Suche (optional)
      # - /mnt/cache:/host/mnt/cache:ro                 # Cache-Pool: was auf den Mover wartet (optional, Unraid)
      # --- A/B Linux: obige /mnt/user-Zeile löschen, dafür:
      # - /etc/os-release:/host/os-release:ro           # nur diese Datei: Name und Version des Systems
      # - /srv:/host/fs/data:ro                         # Ordner, deren Belegung die App zeigen soll (Name frei wählbar)
      # --- C TrueNAS: /mnt/user-Zeile ersetzen durch («tank» = dein Pool):
      # - /mnt/tank:/host/mnt/user:ro
      # --- D Synology: /mnt/user-Zeile ersetzen durch:
      # - /volume1:/host/mnt/user:ro
      # --- L Log-Auszüge und «Heute» (freiwillig, mit NZBLAB_LOGS=1): nur Textdateien (syslog, messages, kern.log)
      # - /var/log:/host/log:ro
      # --- B2 Backups (freiwillig): Repository-Ordner oder Log-Dateien nur lesend einbinden
      # - /mnt/backup/restic:/host/backup/restic:ro
      # - /var/log/rsync-backup.log:/host/backup/rsync-backup.log:ro
    # --- S SMART (freiwillig, mit NZBLAB_SMART=1): jede Platte einzeln freigeben (ls /dev/sd? /dev/nvme?), dazu SYS_RAWIO.
    # Nur ein kleiner Helfer-Prozess bleibt dafür root und startet ausschliesslich «smartctl --scan» und «smartctl -a -n standby»
    # (keine Selbsttests, schlafende Platten werden nicht geweckt); der Agent selbst läuft als PUID ohne Rechte.
    # Nicht zusammen mit «user:» (Linux-Einzeldatei).
    # devices:
    #   - /dev/sda:/dev/sda
    #   - /dev/sdb:/dev/sdb
    #   - /dev/nvme0:/dev/nvme0
    # Dafür unten bei cap_add ergänzen:  - SYS_RAWIO   (SATA/SAS-Platten lesen)
    #                                    - SYS_ADMIN   (nur für NVMe-SMART; breites Recht, NVMe-Temperatur geht auch ohne)
    read_only: true
    tmpfs:
      - /tmp
    # Ab 1.16.1: nur die Rechte, die der Start braucht (/config dem Benutzer PUID geben, dann auf PUID/PGID wechseln);
    # danach hat der Agent gar keine mehr. SMART (Block S): zusätzlich SYS_RAWIO unter cap_add.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
